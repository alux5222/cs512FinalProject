<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Texture Mapping</title>
  <style>
    body { background: #111; color: #ccc; font-family: monospace; }
    /* canvas { border: 1px solid #444; } */
    .layout { display: flex; gap: 10px; align-items: flex-start; }
    /* .editors { display: flex; flex-direction: column; gap: 10px; } */
    /* textarea {
      background: #222;
      color: #0f0;
      font: 14px monospace;
      width: 400px;
      height: 200px;
      box-sizing: border-box;
      white-space: pre;
    } */
    #shaderError { color: #f66; white-space: pre-wrap; width: 400px; margin: 0; }
    /* .controls { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; } */
    /* .control-row { display: flex; align-items: center; gap: 10px; } */
  </style>
</head>
<body>
  <div class="layout">
    <div class="editors" style="display: none;">
      <div>
        <b>Vertex Shader</b><br>
        <textarea id="vertEditor" spellcheck="false"></textarea>
      </div>
      <div>
        <b>Fragment Shader</b><br>
        <textarea id="fragEditor" spellcheck="false"></textarea>
      </div>
      <pre id="shaderError"></pre>
    </div>
    <style>
        /* body{background:#030712;color:#38bdf8;
            font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            display:flex;justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            overflow:hidden
        } */
        div{box-sizing:border-box}
        div>div:first-of-type{
            background:rgba(3,7,18,0.8);border:1px solid rgba(56,189,248,0.3);
            box-shadow:0 0 25px rgba(56,189,248,0.15),inset 0 0 15px rgba(56,189,248,0.05);
            padding:16px;position:relative
        }
        div>div:first-of-type::before{content:"";position:absolute;top:0;left:0;width:8px;height:8px;
        border-top:2px solid #38bdf8;border-left:2px solid #38bdf8
        }
        div>div:first-of-type::after{content:"";position:absolute;
        top:0;right:0;width:8px;height:8px;
        border-top:2px solid #38bdf8;border-right:2px solid #38bdf8
        }
        canvas{display:block;border:1px solid rgba(56,189,248,0.2);box-shadow:inset 0 0 20px rgba(0,0,0,0.8);background:#020617;margin-bottom:16px}
        .controls{display:flex;flex-direction:column;gap:12px}
        .control-row{display:flex;align-items:center;gap:12px;background:rgba(15,23,42,0.6);
            border:1px solid rgba(56,189,248,0.2);padding:10px 14px;position:relative}
        .control-row::after{content:"";position:absolute;bottom:0;right:0;width:4px;height:4px;background:#38bdf8}
        label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7dd3fc}
        span{font-size:12px;color:#38bdf8;min-width:30px;text-align:right}
        input[type=range]{-webkit-appearance:none;width:100%;background:transparent}
        input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(56,189,248,0.2);
            border:1px solid rgba(56,189,248,0.4)}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
            background:#38bdf8;cursor:pointer;margin-top:-5px;box-shadow:0 0 10px #38bdf8}
        select,textarea,.button{background:#020617;border:1px solid rgba(56,189,248,0.4);
            color:#38bdf8;font-family:inherit;font-size:12px;outline:none;transition:all 0.2s ease}
        select{padding:6px 10px;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
        select option{background:#030712;color:#38bdf8}
        .button{padding:6px 14px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;
            position:relative;overflow:hidden}
        .button:hover{background:rgba(56,189,248,0.15);border-color:#38bdf8;
            box-shadow:0 0 15px rgba(56,189,248,0.3)}
        .button:active{background:rgba(56,189,248,0.3)}
        .Input{display:flex;gap:12px;align-items:stretch}
        .textInput{flex-grow:1;height:36px;resize:none;padding:6px 10px;color: chartreuse;}
        select:focus,textarea:focus,.button:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,0.4)}
    </style>>
    <div>
      <canvas id="glcanvas" width="1500" height="750"></canvas>
      <div class="controls">
        <div class="control-row">
          <label for="slider">Rotation Angle:</label>
          <input type="range" id="slider" min="0" max="360" value="0">
          <span id="sliderValue">0</span>
        </div>
        <div class="control-row">
          <select id="axisSelect">
            <option value="x">X Rotation</option>
            <option value="y">Y Rotation</option>
            <option value="z">Z Rotation</option>
          </select>
          <button class = "button" id="spinButton">Start/Stop Rotation</button>
        </div>
        <div class="Input"> 
            <textarea class="textInput"></textarea>
            <button class="button">Generate</button>
        </div>
      </div>
    </div>
  </div>
  <script src="transforms.js"></script>
  <script src="models.js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
